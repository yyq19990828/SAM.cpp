name: Quick checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install small test dependencies and CPU-only Torch
        run: |
          python -m pip install numpy==1.26.4 Pillow==11.2.1 gguf==0.19.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile CPU and independent headers
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=OFF -DGGML_BLAS=OFF -DGGML_NATIVE=OFF
          cmake --build build/ci --parallel 2
      - name: Weight-free checks
        run: |
          ctest --test-dir build/ci --output-on-failure
          python tools/test_tools.py
          python tools/check_docs.py
          git diff --check
